<!DOCTYPE html>
<html lang="en" data-role="loading">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Schedules — Food Bot</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F5F0;
    --surface: #FFFFFF;
    --surface2: #F0EDE6;
    --border: #E2DDD6;
    --text: #1A1714;
    --text-muted: #8C8880;
    --accent: #2D6A4F;
    --accent-light: #E8F4EE;
    --orange: #E07B39;
    --orange-light: #FDF0E7;
    --blue: #3A6EA8;
    --blue-light: #EAF0F8;
    --pink: #C2566A;
    --pink-light: #FAE8EC;
    --yellow: #C49B30;
    --yellow-light: #FBF4E0;
    --gray-light: #F0EDE6;
    --today: #1A1714;
    --shadow-sm: 0 2px 8px rgba(26,23,20,0.07);
    --shadow-md: 0 4px 16px rgba(26,23,20,0.08);
    --bottom-nav: 72px;
    --frame-w: 430px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: #ECE9E1; height: 100%; }
  body {
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    max-width: var(--frame-w);
    margin: 0 auto;
    position: relative;
    overflow-x: hidden;
    box-shadow: 0 0 40px rgba(26,23,20,0.06);
    padding-bottom: var(--bottom-nav);
  }
  @media (min-width: 768px) {
    body { box-shadow: 0 0 64px rgba(26,23,20,0.08); }
  }

  /* ── HEADER ── */
  .header {
    background: var(--surface);
    padding: max(env(safe-area-inset-top, 8px), 8px) 16px 10px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 20px;
    font-weight: 400;
    letter-spacing: -0.4px;
    line-height: 1.1;
    margin-top: 2px;
  }
  .header .hint {
    color: var(--text-muted);
    font-size: 11px;
    margin-top: 3px;
    line-height: 1.35;
  }
  .header .hint code {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 10px;
    background: var(--surface2);
    padding: 1px 5px;
    border-radius: 4px;
  }

  /* ── LIST ── */
  .schedule-list { padding: 10px 12px 12px; }
  .empty {
    text-align: center;
    color: var(--text-muted);
    padding: 40px 24px;
    font-size: 12px;
  }
  .sched-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: var(--shadow-sm);
    transition: transform .12s, box-shadow .12s;
  }
  .sched-card.inactive { opacity: 0.65; }
  .sched-icon {
    width: 32px; height: 32px;
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-size: 14px;
    border-left: 3px solid currentColor;
  }
  .sched-icon.ic-orange { background: var(--orange-light); color: var(--orange); }
  .sched-icon.ic-green  { background: var(--accent-light); color: var(--accent); }
  .sched-icon.ic-blue   { background: var(--blue-light); color: var(--blue); }
  .sched-icon.ic-gray   { background: var(--gray-light); color: #6B6B6B; border-left-color: #AAA; }
  .sched-icon span { line-height: 1; }
  .sched-info { flex: 1; min-width: 0; }
  .sched-name {
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .sched-meta {
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 2px;
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
  }
  .sched-pill {
    display: inline-flex; align-items: center;
    font-size: 9px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .03em;
    padding: 1px 6px;
    border-radius: 999px;
    background: var(--surface2);
    color: var(--text-muted);
  }
  .sched-pill.type-orange { background: var(--orange-light); color: var(--orange); }
  .sched-pill.type-green  { background: var(--accent-light); color: var(--accent); }
  .sched-pill.type-blue   { background: var(--blue-light); color: var(--blue); }

  /* iOS-style toggle (from prototype) */
  .toggle {
    width: 38px; height: 22px; border-radius: 11px;
    background: var(--border);
    position: relative;
    cursor: pointer;
    transition: background .2s;
    flex-shrink: 0;
    border: none;
    padding: 0;
  }
  .toggle.on { background: var(--accent); }
  .toggle::after {
    content: '';
    width: 18px; height: 18px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.2);
    position: absolute;
    top: 2px; left: 2px;
    transition: transform .2s;
  }
  .toggle.on::after { transform: translateX(16px); }
  .toggle:disabled { opacity: 0.5; cursor: not-allowed; }
  .toggle.busy::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 14px;
    background: rgba(0,0,0,0.05);
  }

  /* Tappable card affordance for admins */
  .sched-card.editable { cursor: pointer; }
  .sched-card.editable:active { transform: scale(.99); box-shadow: var(--shadow-md); }

  /* ── Floating "New" button (admin-only) ── */
  .fab {
    position: fixed;
    bottom: calc(var(--bottom-nav) + 14px);
    left: 50%;
    transform: translateX(calc(var(--frame-w) / 2 - 100%));
    margin-left: -16px;
    width: 52px; height: 52px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 26px; line-height: 1;
    box-shadow: var(--shadow-md);
    cursor: pointer;
    z-index: 210;
    display: flex; align-items: center; justify-content: center;
    transition: transform .12s;
  }
  .fab:active { transform: translateX(calc(var(--frame-w) / 2 - 100%)) scale(.92); }

  /* ── Form modal ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(26,23,20,.45);
    backdrop-filter: blur(4px);
    z-index: 300;
    opacity: 0; pointer-events: none;
    transition: opacity .25s;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal-sheet {
    background: var(--surface);
    border-radius: 24px 24px 0 0;
    width: 100%; max-width: var(--frame-w);
    padding: 0 0 28px;
    transform: translateY(100%);
    transition: transform .3s cubic-bezier(.32,1,.58,1);
    max-height: 92vh; overflow-y: auto;
  }
  .modal-overlay.open .modal-sheet { transform: translateY(0); }
  .modal-handle { width: 36px; height: 4px; border-radius: 2px; background: var(--border); margin: 12px auto 0; }
  .modal-header {
    padding: 14px 20px 8px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .modal-title { font-family: 'DM Serif Display', serif; font-size: 20px; }
  .modal-body { padding: 4px 20px; }
  .field { margin-bottom: 14px; }
  .field label {
    display: block; font-size: 11px; font-weight: 600;
    color: var(--text-muted); text-transform: uppercase;
    letter-spacing: .04em; margin-bottom: 5px;
  }
  .field input, .field select {
    width: 100%; height: 42px;
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--surface); color: var(--text);
    font-family: inherit; font-size: 14px;
    padding: 0 12px;
  }
  .field input:focus, .field select:focus { outline: none; border-color: var(--accent); }
  .day-picker { display: flex; gap: 5px; flex-wrap: wrap; }
  .day-chip {
    flex: 1; min-width: 38px; height: 36px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); color: var(--text-muted);
    font-size: 11px; font-weight: 600; cursor: pointer;
    transition: all .12s;
  }
  .day-chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .modal-actions { display: flex; gap: 10px; padding: 8px 20px 0; }
  .btn {
    flex: 1; height: 46px; border-radius: 12px; border: none; cursor: pointer;
    font-family: inherit; font-size: 14px; font-weight: 600; transition: transform .12s;
  }
  .btn:active { transform: scale(.97); }
  .btn-save { background: var(--accent); color: #fff; }
  .btn-delete { background: var(--pink-light); color: var(--pink); flex: 0 0 46px; font-size: 18px; }

  /* ── BOTTOM NAV ── */
  .bottom-nav {
    position: fixed;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 100%; max-width: var(--frame-w);
    height: var(--bottom-nav);
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-around;
    padding: 0 8px env(safe-area-inset-bottom, 8px);
    z-index: 200;
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    cursor: pointer; padding: 8px 10px; border-radius: 12px;
    transition: background .15s;
    text-decoration: none;
    flex: 1;
    min-width: 0;
    color: inherit;
  }
  .nav-item:active { background: var(--surface2); }
  .nav-icon {
    width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-muted);
  }
  .nav-label {
    font-size: 10px; font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.01em;
  }
  .nav-item.active .nav-icon { color: var(--accent); }
  .nav-item.active .nav-label { color: var(--accent); }

  /* ── Toast ── */
  .toast {
    position: fixed; bottom: calc(var(--bottom-nav) + 16px); left: 50%;
    transform: translateX(-50%);
    background: var(--text); color: var(--surface);
    padding: 10px 16px; border-radius: 999px;
    font-size: 13px; font-weight: 500;
    opacity: 0; transition: opacity .2s;
    pointer-events: none; z-index: 400;
    max-width: calc(var(--frame-w) - 40px);
  }
  .toast.show { opacity: .95; }
  .toast.error { background: #B83A3A; }

  /* ── Dark mode (mirrors index.html) ── */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161412;
      --surface: #1E1B17;
      --surface2: #2A261F;
      --border: #332F27;
      --text: #F2EDE4;
      --text-muted: #8A8070;
      --accent: #58D69E;
      --accent-light: rgba(45, 106, 79, 0.22);
      --orange-light: rgba(224, 123, 57, 0.18);
      --blue-light: rgba(58, 110, 168, 0.20);
      --gray-light: rgba(255, 255, 255, 0.08);
      --today: #F2EDE4;
    }
    html { background: #0F0D0B; }
    .sched-icon.ic-orange { color: #F5BC8C; }
    .sched-icon.ic-green  { color: #A7E5C3; }
    .sched-icon.ic-blue   { color: #9BBDE0; }
    .sched-pill.type-orange { color: #F5BC8C; }
    .sched-pill.type-green  { color: #A7E5C3; }
    .sched-pill.type-blue   { color: #9BBDE0; }
  }
</style>
</head>
<body>

<header class="header">
  <h1>Schedules</h1>
  <p class="hint admin-only">
    Toggle reminders on or off. To add or change a schedule's time, edit the

  <p class="hint member-only">
    The recurring reminders this bot will send. Ask an admin to change them.
  </p>

<!-- Create / edit form -->
<div class="modal-overlay" id="formOverlay">

    <div class="modal-header">

      <div class="field">

          <option value="QR_PHOTO">Send QR photo</option>

      <div class="field">

      <div class="field">
        <label>Days</label>

      </div>
      <div class="field">
        <label for="f-time">Time (24h HH:MM)</label>

      <div class="field">
        <label for="f-targets">Target chats</label>

    <div class="modal-actions">

      <button class="btn btn-save" id="formSave">Save</button>

</div>

<script src="/app.js"></script>
<script>
  // ─── Helpers ──────────────────────────────────────────────
  const DAY_ORDER = { MON:0, TUE:1, WED:2, THU:3, FRI:4, SAT:5, SUN:6 };
  const DAY_PRETTY = { MON:"Mon", TUE:"Tue", WED:"Wed", THU:"Thu", FRI:"Fri", SAT:"Sat", SUN:"Sun" };

  function actionIconChar(t) {
    switch ((t || "").toUpperCase()) {
      case "TEXT":     return "💬";
      case "QR_PHOTO": return "📷";
      case "POLL":     return "🗳️";
      default:         return "⏰";
    }
  }
  function actionColorClass(t) {
    switch ((t || "").toUpperCase()) {
      case "TEXT":     return "orange";
      case "QR_PHOTO": return "green";
      case "POLL":     return "blue";
      default:         return "gray";
    }
  }
  function actionTypeLabel(t) {
    switch ((t || "").toUpperCase()) {
      case "TEXT":     return "Text";
      case "QR_PHOTO": return "QR";
      case "POLL":     return "Poll";
      default:         return t || "—";
    }
  }
  function formatDays(daysRaw) {
    const codes = (daysRaw || "")
      .split(",").map((s) => s.trim().toUpperCase()).filter(Boolean);
    if (!codes.length) return "—";
    const sorted = codes.slice().sort((a,b) => (DAY_ORDER[a] ?? 9) - (DAY_ORDER[b] ?? 9));
    // Weekday-shortcut: MON–FRI
    const set = new Set(sorted);
    const weekdays = ["MON","TUE","WED","THU","FRI"];
    if (set.size === 5 && weekdays.every((d) => set.has(d))) return "Weekdays";
    if (set.size === 7) return "Every day";
    if (set.size === 2 && set.has("SAT") && set.has("SUN")) return "Weekends";
    return sorted.map((c) => DAY_PRETTY[c] || c).join(" · ");
  }
  function formatTime(s) {
    if (!s) return "—";
    const m = String(s).match(/^(\d{1,2}):(\d{2})/);
    if (!m) return s;
    const h = parseInt(m[1], 10), mm = m[2];
    const period = h >= 12 ? "PM" : "AM";
    const hh = h === 0 ? 12 : (h > 12 ? h - 12 : h);
    return `${hh}:${mm} ${period}`;
  }

  // ─── Toast (matches calendar) ─────────────────────────────
  let toastTimer = null;
  function toast(msg, kind) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.remove("error");
    if (kind === "error") el.classList.add("error");
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 2400);
  }

  // ─── Render ───────────────────────────────────────────────
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
    }[c]));
  }

  async function refresh() {
    const list = document.getElementById("list");
    list.textContent = "";

    let rows;
    try {
      rows = await window.FoodBot.api("/schedules");
    } catch (err) {
      const e = document.createElement("div");
      e.className = "empty";
      e.textContent = err.message || String(err);
      list.appendChild(e);
      return;
    }
    if (!rows || !rows.length) {
      const e = document.createElement("div");
      e.className = "empty";
      e.textContent = "No schedules defined.";
      list.appendChild(e);
      return;
    }

    for (const row of rows) {
      list.appendChild(renderCard(row));
    }
  }

  function renderCard(row) {
    const active = String(row.is_active).toUpperCase() === "TRUE";
    const color = actionColorClass(row.action_type);
    const isAdmin = !!(window.FoodBot && window.FoodBot.isAdmin);
    const card = document.createElement("div");
    card.className = "sched-card" + (active ? "" : " inactive") + (isAdmin ? " editable" : "");

    card.innerHTML = `
      <div class="sched-icon ic-${color}"><span>${actionIconChar(row.action_type)}</span></div>
      <div class="sched-info">
        <div class="sched-name">${escapeHtml(row.name || row.schedule_id)}</div>
        <div class="sched-meta">
          <span class="sched-pill type-${color}">${escapeHtml(actionTypeLabel(row.action_type))}</span>
          <span>${escapeHtml(formatTime(row.time_of_day))}</span>
          <span>·</span>
          <span>${escapeHtml(formatDays(row.days_of_week))}</span>
        </div>
      </div>
    `;

    if (isAdmin) {
      // Tap the card body to edit; the toggle handles enable/disable inline.
      card.addEventListener("click", () => openForm(row));
      const toggle = document.createElement("button");
      toggle.className = "toggle" + (active ? " on" : "");
      toggle.setAttribute("aria-label", active ? "Disable" : "Enable");
      toggle.addEventListener("click", (e) => { e.stopPropagation(); onToggle(row, toggle); });
      card.appendChild(toggle);
    }
    // Members: render the card but omit the toggle entirely — no replacement.
    return card;
  }

  // ─── Create / edit / delete form ─────────────────────────────
  const DAY_CODES = ["MON","TUE","WED","THU","FRI","SAT","SUN"];
  let editingId = null;  // null = creating

  function renderDayPicker(selected) {
    const wrap = document.getElementById("f-days");
    const set = new Set((selected || "").split(",").map((s) => s.trim().toUpperCase()));
    wrap.textContent = "";
    for (const code of DAY_CODES) {
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "day-chip" + (set.has(code) ? " on" : "");
      chip.dataset.day = code;
      chip.textContent = DAY_PRETTY[code];
      chip.addEventListener("click", () => chip.classList.toggle("on"));
      wrap.appendChild(chip);
    }
  }
  function selectedDays() {
    return Array.from(document.querySelectorAll("#f-days .day-chip.on"))
      .map((c) => c.dataset.day).join(",");
  }
  function syncPayloadLabel() {
    const action = document.getElementById("f-action").value;
    const label = document.getElementById("f-payload-label");
    const input = document.getElementById("f-payload");
    if (action === "QR_PHOTO") {
      label.textContent = "Image filename in assets/";
      input.placeholder = "payment_qr.png";
    } else {
      label.textContent = "Text (leave blank to use Daily message)";
      input.placeholder = "";
    }
  }

  function openForm(row) {
    editingId = row ? row.schedule_id : null;
    document.getElementById("formTitle").textContent = row ? "Edit schedule" : "New schedule";
    document.getElementById("f-name").value = row ? (row.name || "") : "";
    document.getElementById("f-action").value =
      row && row.action_type ? String(row.action_type).toUpperCase() : "TEXT";
    document.getElementById("f-payload").value = row ? (row.payload || "") : "";
    document.getElementById("f-time").value =
      row && row.time_of_day ? String(row.time_of_day).slice(0, 5) : "08:00";
    document.getElementById("f-targets").value = row ? (row.target_chat_ids || "ALL") : "ALL";
    renderDayPicker(row ? row.days_of_week : "MON,TUE,WED,THU,FRI");
    syncPayloadLabel();
    document.getElementById("formDelete").style.display = row ? "block" : "none";
    document.getElementById("formOverlay").classList.add("open");
  }
  function closeForm() { document.getElementById("formOverlay").classList.remove("open"); }

  async function saveForm() {
    const days = selectedDays();
    const time = document.getElementById("f-time").value;
    if (!time) { toast("Pick a time", "error"); return; }
    if (!days) { toast("Pick at least one day", "error"); return; }
    const body = {
      name: document.getElementById("f-name").value.trim(),
      action_type: document.getElementById("f-action").value,
      payload: document.getElementById("f-payload").value,
      days_of_week: days,
      time_of_day: time,
      target_chat_ids: document.getElementById("f-targets").value.trim() || "ALL",
    };
    const saveBtn = document.getElementById("formSave");
    saveBtn.disabled = true;
    try {
      if (editingId) {
        await window.FoodBot.api(`/schedules/${encodeURIComponent(editingId)}`,
          { method: "PUT", body: JSON.stringify(body) });
        toast("Schedule updated");
      } else {
        await window.FoodBot.api("/schedules",
          { method: "POST", body: JSON.stringify(body) });
        toast("Schedule created");
      }
      closeForm();
      await refresh();
    } catch (err) {
      toast(err.message || String(err), "error");
    } finally {
      saveBtn.disabled = false;
    }
  }

  async function deleteForm() {
    if (!editingId) return;
    if (!window.confirm("Delete this schedule?")) return;
    try {
      await window.FoodBot.api(`/schedules/${encodeURIComponent(editingId)}`, { method: "DELETE" });
      toast("Schedule deleted");
      closeForm();
      await refresh();
    } catch (err) {
      toast(err.message || String(err), "error");
    }
  }

  async function onToggle(row, toggleEl) {
    if (toggleEl.disabled) return;
    const wasOn = toggleEl.classList.contains("on");
    const nextActive = !wasOn;

    // Optimistic UI
    toggleEl.classList.toggle("on", nextActive);
    toggleEl.classList.add("busy");
    toggleEl.disabled = true;

    try {
      await window.FoodBot.api(
        `/schedules/${encodeURIComponent(row.schedule_id)}/toggle`,
        { method: "POST", body: JSON.stringify({ active: nextActive }) },
      );
      toast(`${nextActive ? "Enabled" : "Disabled"} ${row.name || row.schedule_id}`);
      // Reflect inactive dim on the card.
      const card = toggleEl.closest(".sched-card");
      if (card) card.classList.toggle("inactive", !nextActive);
    } catch (err) {
      // Revert on failure.
      toggleEl.classList.toggle("on", wasOn);
      toast(err.message || String(err), "error");
    } finally {
      toggleEl.classList.remove("busy");
      toggleEl.disabled = false;
    }
  }

  window.pageInit = async function () {
    document.getElementById("fab").addEventListener("click", () => openForm(null));
    document.getElementById("formClose").addEventListener("click", closeForm);
    document.getElementById("formOverlay").addEventListener("click", (e) => {
      if (e.target.id === "formOverlay") closeForm();
    });
    document.getElementById("formSave").addEventListener("click", saveForm);
    document.getElementById("formDelete").addEventListener("click", deleteForm);
    document.getElementById("f-action").addEventListener("change", syncPayloadLabel);
    await refresh();
  };
</script>
</body>
</html>
