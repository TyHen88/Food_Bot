<!DOCTYPE html>
<html lang="en" data-role="loading">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Templates — Food Bot</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F5F0;
    --surface: #FFFFFF;
    --surface2: #F0EDE6;
    --border: #E2DDD6;
    --text: #1A1714;
    --text-muted: #8C8880;
    --accent: #2D6A4F;
    --accent-light: #E8F4EE;
    --orange: #E07B39;
    --orange-light: #FDF0E7;
    --blue: #3A6EA8;
    --blue-light: #EAF0F8;
    --pink: #C2566A;
    --pink-light: #FAE8EC;
    --yellow: #C49B30;
    --yellow-light: #FBF4E0;
    --gray-light: #F0EDE6;
    --today: #1A1714;
    --danger: #B83A3A;
    --shadow-sm: 0 2px 8px rgba(26,23,20,0.07);
    --shadow-md: 0 4px 16px rgba(26,23,20,0.08);
    --bottom-nav: 72px;
    --frame-w: 430px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: #ECE9E1; height: 100%; }
  body {
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    max-width: var(--frame-w);
    margin: 0 auto;
    position: relative;
    overflow-x: hidden;
    box-shadow: 0 0 40px rgba(26,23,20,0.06);
    padding-bottom: calc(var(--bottom-nav) + 8px);
  }
  @media (min-width: 768px) { body { box-shadow: 0 0 64px rgba(26,23,20,0.08); } }

  /* ── HEADER ── */
  .header {
    background: var(--surface);
    padding: max(env(safe-area-inset-top, 8px), 8px) 16px 0;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 20px;
    font-weight: 400;
    letter-spacing: -0.4px;
    line-height: 1.1;
    margin-top: 2px;
  }
  .header .hint {
    color: var(--text-muted);
    font-size: 11px;
    margin-top: 3px;
    line-height: 1.35;
  }
  .header .hint code {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 10px;
    background: var(--surface2);
    padding: 1px 5px;
    border-radius: 4px;
  }

  .tab-content { padding: 12px 16px 16px; }

  /* ── Section ── */
  .section-title {
    font-size: 10px; font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: .06em;
    padding: 10px 0 8px;
  }

  /* ── Empty state ── */
  .empty {
    text-align: center;
    color: var(--text-muted);
    padding: 32px 24px;
    font-size: 12px;
  }

  /* ── Message-style preview cards ── */
  .style-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 12px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: border-color .15s, background .15s, transform .12s;
    box-shadow: var(--shadow-sm);
    position: relative;
  }
  .style-card:active { transform: scale(.99); }
  .style-card.selected {
    border-color: var(--accent);
    background: var(--accent-light);
  }
  .style-card-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px;
  }
  .style-card-name {
    font-size: 13px; font-weight: 600; color: var(--text);
    display: flex; align-items: center; gap: 8px;
  }
  .style-card-num {
    width: 22px; height: 22px;
    border-radius: 7px;
    background: var(--surface2);
    color: var(--text-muted);
    font-family: 'DM Serif Display', serif;
    font-size: 12px;
    display: flex; align-items: center; justify-content: center;
  }
  .style-card.selected .style-card-num {
    background: var(--accent);
    color: #fff;
  }
  .style-card-sub { font-size: 10px; color: var(--text-muted); }
  .style-check {
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    color: transparent;
  }
  .style-card.selected .style-check {
    border-color: var(--accent);
    background: var(--accent);
    color: #fff;
  }
  .style-preview {
    background: #FAF8F3;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-family: ui-monospace, "SF Mono", "DM Mono", Menlo, monospace;
    font-size: 10px;
    color: var(--text);
    line-height: 1.4;
    white-space: pre-wrap;
    overflow: hidden;
    max-height: 200px;
  }
  .style-card.selected .style-preview {
    background: var(--surface);
  }

  /* ── Bottom nav (same as other pages) ── */
  .bottom-nav {
    position: fixed;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 100%; max-width: var(--frame-w);
    height: var(--bottom-nav);
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-around;
    padding: 0 8px env(safe-area-inset-bottom, 8px);
    z-index: 200;
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    cursor: pointer; padding: 8px 10px; border-radius: 12px;
    transition: background .15s;
    text-decoration: none; flex: 1; min-width: 0; color: inherit;
  }
  .nav-item:active { background: var(--surface2); }
  .nav-icon {
    width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-muted);
  }
  .nav-label {
    font-size: 10px; font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.01em;
  }
  .nav-item.active .nav-icon { color: var(--accent); }
  .nav-item.active .nav-label { color: var(--accent); }

  /* ── Toast ── */
  .toast {
    position: fixed; bottom: calc(var(--bottom-nav) + 16px); left: 50%;
    transform: translateX(-50%);
    background: var(--text); color: var(--surface);
    padding: 10px 16px; border-radius: 999px;
    font-size: 13px; font-weight: 500;
    opacity: 0; transition: opacity .2s;
    pointer-events: none; z-index: 400;
    max-width: calc(var(--frame-w) - 40px);
  }
  .toast.show { opacity: .95; }
  .toast.error { background: #B83A3A; }

  /* Dark mode */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161412;
      --surface: #1E1B17;
      --surface2: #2A261F;
      --border: #332F27;
      --text: #F2EDE4;
      --text-muted: #8A8070;
      --accent: #58D69E;
      --accent-light: rgba(45, 106, 79, 0.22);
      --orange-light: rgba(224, 123, 57, 0.18);
      --gray-light: rgba(255, 255, 255, 0.08);
      --today: #F2EDE4;
    }
    html { background: #0F0D0B; }
    .style-preview { background: #161311; }
    .style-card.selected .style-preview { background: var(--surface); }
  }
</style>
</head>
<body>

<header class="header">
  <h1>Message Style</h1>
  <p class="hint">Pick how the bot formats the order-summary message when someone taps the Order button.</p>
</header>

<section class="tab-content active" id="tab-style" style="display: block;">
  <div class="section-title">Order summary template</div>
  <div id="styleList"></div>
</section>

<!-- Bottom nav -->

<div class="toast" id="toast"></div>

<script src="/app.js"></script>
<script>
  // ─── Toast ──────────────────────────────────────────────────
  let toastTimer = null;
  function toast(msg, kind) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.remove("error");
    if (kind === "error") el.classList.add("error");
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 2400);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
    }[c]));
  }

  // ─── Style previews (mirror bot/utils.py output) ────────────
  const SAMPLE_NAME = "Seyha";
  const SAMPLE_ITEMS = [
    { name: "បបរសាច់គោ", qty: 1, voter: "Tii" },
    { name: "សម្លកកូរ", qty: 1, voter: "Tii" },
  ];

  function preview1() {
    const sep = "━".repeat(20);
    const lines = [`🛒 Name: ${SAMPLE_NAME}`, sep, "🍱 Order"];
    SAMPLE_ITEMS.forEach((it, i) => lines.push(`   ${i+1}) ${it.name} × ${it.qty}`));
    lines.push(sep, "👥 Detail");
    SAMPLE_ITEMS.forEach((it) => lines.push(`   • ${it.name} × ${it.qty} (${it.voter})`));
    lines.push(sep, `Total: ${SAMPLE_ITEMS.length} dishes`);
    return lines.join("\n");
  }
  function preview2() {
    const lines = [`🛒 ${SAMPLE_NAME}'s order`, ""];
    SAMPLE_ITEMS.forEach((it) => lines.push(`• ${it.name} × ${it.qty} — ${it.voter}`));
    lines.push("", `📦 ${SAMPLE_ITEMS.length} dishes · 1 person`);
    return lines.join("\n");
  }
  function preview3() {
    const inner = ` 🍴 Food Order — for ${SAMPLE_NAME} `;
    const top = "╭" + "─".repeat(inner.length) + "╮";
    const mid = "│" + inner + "│";
    const bot = "╰" + "─".repeat(inner.length) + "╯";
    const lines = [top, mid, bot, ""];
    SAMPLE_ITEMS.forEach((it) => {
      lines.push(`🥢 ${it.name}`);
      lines.push(`    × ${it.qty} · ${it.voter}`);
      lines.push("");
    });
    lines.push("━".repeat(16), `Total: ${SAMPLE_ITEMS.length} items`);
    return lines.join("\n");
  }

  const STYLES = [
    { id: "1", name: "Classic Receipt", sub: "Two clearly separated sections", preview: preview1() },
    { id: "2", name: "Compact",         sub: "Chat-friendly single list",      preview: preview2() },
    { id: "3", name: "Card",            sub: "Boxed header + per-item blocks", preview: preview3() },
  ];

  let currentStyle = "1";
  let stylePending = false;

  // Reverse handlers.encode_chat_param: "g<digits>" -> "-<digits>",
  // "c<digits>" -> "<digits>"; plain numeric passes through.
  function decodeChatParam(p) {
    if (!p) return "";
    const s = String(p);
    if (s[0] === "g") return "-" + s.slice(1);
    if (s[0] === "c") return s.slice(1);
    return s;
  }
  // The group the app was launched from; "" when opened from the bot DM.
  function launchChatId() {
    const tg = window.Telegram && window.Telegram.WebApp;
    const u = tg && tg.initDataUnsafe;
    if (u && u.chat && u.chat.id != null) return String(u.chat.id);
    if (u && u.start_param) return decodeChatParam(u.start_param);
    return "";
  }
  function styleQuery() {
    const cid = launchChatId();
    return cid ? `?chat_id=${encodeURIComponent(cid)}` : "";
  }

  async function loadStyle() {
    try {
      // Per-chat style when launched from a group, else the global default.
      const res = await window.FoodBot.api(`/templates/style${styleQuery()}`);
      if (res && res.style) currentStyle = String(res.style).trim();
    } catch (_) { /* leave default */ }
  }

  function renderStyleList() {
    const list = document.getElementById("styleList");
    list.textContent = "";
    for (const s of STYLES) {
      const selected = s.id === currentStyle;
      const card = document.createElement("div");
      card.className = "style-card" + (selected ? " selected" : "");
      card.innerHTML = `
        <div class="style-card-head">
          <div class="style-card-name">
            <span class="style-card-num">${escapeHtml(s.id)}</span>
            <span>
              ${escapeHtml(s.name)}
              <div class="style-card-sub">${escapeHtml(s.sub)}</div>
            </span>
          </div>
          <span class="style-check">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </span>
        </div>
        <pre class="style-preview">${escapeHtml(s.preview)}</pre>
      `;
      card.addEventListener("click", () => onSelectStyle(s.id));
      list.appendChild(card);
    }
  }

  async function onSelectStyle(id) {
    if (stylePending || id === currentStyle) return;
    const prev = currentStyle;
    currentStyle = id;
    renderStyleList();
    stylePending = true;
    try {
      await window.FoodBot.api(`/templates/style${styleQuery()}`, {
        method: "PUT",
        body: JSON.stringify({ value: id }),
      });
      toast(`Style ${id} selected`);
    } catch (err) {
      currentStyle = prev;
      renderStyleList();
      toast(err.message || String(err), "error");
    } finally {
      stylePending = false;
    }
  }

  // ─── Boot ───────────────────────────────────────────────────
  window.pageInit = async function () {
    // Templates is admin-only — bounce members who deep-link here.
    if (!(window.FoodBot && window.FoodBot.isAdmin)) {
      location.href = "/";
      return;
    }
    await loadStyle();
    renderStyleList();
  };
</script>
</body>
